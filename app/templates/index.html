<!doctype html><html><head><meta charset='utf-8'><title>CTBaiCalc</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'></head>
<body class='bg-light'><div class='container py-4'>
<h1>CTBaiCalc</h1>
<div class='card p-3 mb-4'><h5>Создать исследование</h5>
<div class='row g-2'><div class='col'><input id='name' class='form-control' placeholder='Название'></div><div class='col'><input id='indication' class='form-control' placeholder='Indication'></div><div class='col'><button class='btn btn-primary' onclick='createStudy()'>Создать</button></div></div></div>
<div class='row'>
{% for s in studies %}
<div class='col-md-4'><div class='card mb-3'><div class='card-body'><h5>{{s.name}}</h5><p>{{s.indication}} / Phase {{s.phase}}</p><a class='btn btn-outline-primary' href='/study/{{s.id}}'>Открыть</a></div></div></div>
{% endfor %}
</div></div>
<script>
async function createStudy(){
const r=await fetch('/api/studies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,indication:document.getElementById('indication').value||'General'})});
if(r.ok) location.reload(); else alert('Ошибка');}
</script></body></html>
