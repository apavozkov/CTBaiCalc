<!doctype html><html><head><meta charset='utf-8'><title>{{study.name}}</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'></head>
<body><div class='container py-4'><a href='/'>← Назад</a><h2>{{study.name}}</h2>
<div class='d-flex gap-2 mb-3'>
  <button class='btn btn-outline-secondary btn-sm' onclick='toggleEditStudy()'>Редактировать</button>
  <button class='btn btn-outline-danger btn-sm' onclick='deleteStudy()'>Удалить</button>
</div>
<div id='studyEditBox' class='card p-3 mb-3 d-none'>
  <h6 class='mb-2'>Редактирование исследования</h6>
  <div class='row g-2'>
    <div class='col-md-6'><input id='studyName' class='form-control' value='{{study.name}}' placeholder='Название исследования'></div>
    <div class='col-md-6'><input id='studyIndication' class='form-control' value='{{study.indication}}' placeholder='Indication'></div>
  </div>
  <div class='mt-2 d-flex gap-2'>
    <button class='btn btn-primary btn-sm' onclick='saveStudy()'>Сохранить</button>
    <button class='btn btn-light btn-sm' onclick='toggleEditStudy()'>Отмена</button>
  </div>
</div>
<div class='card p-3 mb-3'><h5>Новая версия бюджета</h5><div class='row g-2'><div class='col'><input id='vname' class='form-control' placeholder='Наименование'></div><div class='col'><button onclick='createVersion()' class='btn btn-primary'>Создать</button></div></div></div>
<ul class='list-group'>
{% for v in study.versions %}<li class='list-group-item d-flex justify-content-between' role='link' tabindex='0' style='cursor:pointer' onclick="window.location.href='/version/{{v.id}}'" onkeydown="if(event.key==='Enter'||event.key===' '){window.location.href='/version/{{v.id}}'}"><span>{{v.name}}</span></li>{% endfor %}
</ul></div>
<script>
async function createVersion(){const r=await fetch('/api/studies/{{study.id}}/versions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('vname').value,currency:'USD'})});if(r.ok) location.reload();}
function toggleEditStudy(){document.getElementById('studyEditBox').classList.toggle('d-none');}
async function saveStudy(){
  const payload={name:document.getElementById('studyName').value,indication:document.getElementById('studyIndication').value};
  const r=await fetch('/api/studies/{{study.id}}',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r.ok) location.reload();
}
async function deleteStudy(){
  if(!confirm('Удалить исследование и все версии бюджета?')) return;
  const r=await fetch('/api/studies/{{study.id}}',{method:'DELETE'});
  if(r.ok) window.location.href='/';
}
</script></body></html>
