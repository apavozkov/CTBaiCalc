<!doctype html><html><head><meta charset='utf-8'><title>{{study.name}}</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'></head>
<body><div class='container py-4'><a href='/'>← Назад</a><h2>{{study.name}}</h2>
<div class='card p-3 mb-3'><h5>Новая версия бюджета</h5><div class='row g-2'><div class='col'><input id='vname' class='form-control' placeholder='Baseline / Amend-1'></div><div class='col'><button onclick='createVersion()' class='btn btn-primary'>Создать</button></div></div></div>
<ul class='list-group'>
{% for v in study.versions %}<li class='list-group-item d-flex justify-content-between'><span>{{v.name}} ({{v.currency}})</span><a class='btn btn-sm btn-outline-primary' href='/version/{{v.id}}'>Открыть</a></li>{% endfor %}
</ul></div>
<script>
async function createVersion(){const r=await fetch('/api/studies/{{study.id}}/versions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('vname').value,currency:'USD'})});if(r.ok) location.reload();}
</script></body></html>
