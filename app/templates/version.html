<!doctype html><html><head><meta charset='utf-8'><title>{{version.name}}</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script></head>
<body><div class='container py-4'>
<a href='/study/{{version.study_id}}'>← Назад</a><h2>{{version.name}}</h2>
<div class='row'>
<div class='col-md-6'><div class='card p-3 mb-3'><h5>Добавить статью</h5>
<input id='item_name' class='form-control mb-2' placeholder='Наименование'>
<select id='category' class='form-select mb-2'><option>Sites</option><option>Monitoring</option><option>Laboratory</option><option>Logistics</option></select>
<select id='qtype' class='form-select mb-2'><option value='per-patient'>per-patient</option><option value='per-visit'>per-visit</option><option value='per-site'>per-site</option><option value='per-site-visit'>per-site-visit</option><option value='fixed'>fixed</option></select>
<input id='cost' type='number' class='form-control mb-2' placeholder='Стоимость'>
<input id='qty' type='number' class='form-control mb-2' value='1' placeholder='manual qty'>
<button class='btn btn-primary' onclick='addItem()'>Добавить</button></div></div>
<div class='col-md-6'><div class='card p-3 mb-3'><h5>Сценарий</h5>
<input id='slabel' class='form-control mb-2' placeholder='Scenario label'>
<input id='patients' type='number' class='form-control mb-2' value='100'>
<input id='sites' type='number' class='form-control mb-2' value='15'>
<input id='visits' type='number' class='form-control mb-2' value='8'>
<button class='btn btn-success' onclick='recalc()'>Пересчитать</button>
</div></div></div>
<div id='result'></div><canvas id='pie' height='100'></canvas>
</div>
<script>
let lastScenarioId=null;let chart=null;
async function addItem(){
const body={item_name:item_name.value,category:category.value,unit_cost:Number(cost.value),qty_formula_type:qtype.value,manual_qty:Number(qty.value),subcategory:'General',unit:'service',notes:''};
const r=await fetch('/api/versions/{{version.id}}/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok) alert('Добавлено');}
async function recalc(){
const body={label:slabel.value||'Scenario',patients:Number(patients.value),sites:Number(sites.value),visits:Number(visits.value),monitoring_visits_per_site:4};
const r=await fetch('/api/versions/{{version.id}}/scenarios/recalculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();lastScenarioId=d.scenario_id;
let html=`<div class='alert alert-info'>Grand total: <b>${d.grand_total}</b> <button class='btn btn-sm btn-outline-dark ms-2' onclick='ai()'>AI анализ</button> <a class='btn btn-sm btn-outline-primary ms-2' href='/api/scenarios/${lastScenarioId}/export.xlsx'>XLSX</a></div>`;
html+='<table class="table table-sm"><tr><th>Категория</th><th>Total</th><th>%</th></tr>';
d.categories.forEach(c=>html+=`<tr><td>${c.category}</td><td>${c.total}</td><td>${c.share_pct}</td></tr>`);html+='</table><div id="ai"></div>';result.innerHTML=html;
const ctx=document.getElementById('pie');if(chart){chart.destroy();}
chart=new Chart(ctx,{type:'pie',data:{labels:d.categories.map(x=>x.category),datasets:[{data:d.categories.map(x=>x.total)}]}});
}
async function ai(){const r=await fetch(`/api/ai/structure-analysis/${lastScenarioId}`,{method:'POST'});const d=await r.json();document.getElementById('ai').innerHTML=`<div class='card card-body'><pre style='white-space:pre-wrap'>${d.report}</pre></div>`;}
</script></body></html>
