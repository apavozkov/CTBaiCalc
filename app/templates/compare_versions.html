<!doctype html>
<html>
<head>
  <meta charset='utf-8'>
  <title>Сравнение бюджетов — {{study.name}}</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
  <style>
    .cmp-same { background-color: #e8f5e9; }
    .cmp-diff { background-color: #fff8e1; }
    .cmp-missing { background-color: #ffebee; }
  </style>
</head>
<body>
<div class='container py-4'>
  <a href='/study/{{study.id}}'>← Назад к исследованию</a>
  <h2 class='mb-3'>Сравнение версий бюджета</h2>

  <div class='card p-3 mb-3'>
    <h5>Сценарий</h5>
    <div class='row g-2 align-items-end'>
      <div class='col-md-6'>
        <label for='versionA' class='form-label mb-1'>Версия A</label>
        <select id='versionA' class='form-select form-select-sm'>
          <option value=''>Выберите версию</option>
          {% for v in versions %}<option value='{{v.id}}'>{{v.name}}</option>{% endfor %}
        </select>
      </div>
      <div class='col-md-6'>
        <label for='versionB' class='form-label mb-1'>Версия B</label>
        <select id='versionB' class='form-select form-select-sm'>
          <option value=''>Выберите версию</option>
          {% for v in versions %}<option value='{{v.id}}'>{{v.name}}</option>{% endfor %}
        </select>
      </div>
      <div class='col-12 col-sm-4'>
        <label for='patients' class='form-label mb-1'>Пациенты</label>
        <input id='patients' type='number' class='form-control form-control-sm' value='100'>
      </div>
      <div class='col-12 col-sm-4'>
        <label for='sites' class='form-label mb-1'>Площадки</label>
        <input id='sites' type='number' class='form-control form-control-sm' value='15'>
      </div>
      <div class='col-12 col-sm-4'>
        <label for='visits' class='form-label mb-1'>Визиты</label>
        <input id='visits' type='number' class='form-control form-control-sm' value='8'>
      </div>
      <div class='col-12'>
        <button class='btn btn-success btn-sm' onclick='compareBudgets()'>Сравнить</button>
      </div>
    </div>
  </div>

  <div id='result'></div>
</div>

<script>
function fmt(n){ return Number(n || 0).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

async function compareBudgets(){
  const payload = {
    version_a_id: Number(document.getElementById('versionA').value),
    version_b_id: Number(document.getElementById('versionB').value),
    patients: Number(document.getElementById('patients').value),
    sites: Number(document.getElementById('sites').value),
    visits: Number(document.getElementById('visits').value),
    monitoring_visits_per_site: 4,
  };

  if (!payload.version_a_id || !payload.version_b_id){
    alert('Выберите обе версии бюджета.');
    return;
  }

  const r = await fetch('/api/studies/{{study.id}}/compare-versions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  if (!r.ok){
    alert(`Ошибка сравнения: HTTP ${r.status}`);
    return;
  }

  const d = await r.json();
  const totalClass = d.grand_total_a === d.grand_total_b ? 'cmp-same' : 'cmp-diff';
  let html = `<div class='card p-3 mb-3'>
    <h6>Итоги</h6>
    <table class='table table-sm mb-0'>
      <thead><tr><th>Показатель</th><th>${d.version_a_name}</th><th>${d.version_b_name}</th></tr></thead>
      <tbody>
        <tr><td>Grand total</td><td class='${totalClass}'>${fmt(d.grand_total_a)}</td><td class='${totalClass}'>${fmt(d.grand_total_b)}</td></tr>
      </tbody>
    </table>
  </div>`;

  html += `<div class='card p-3'><h6>Сравнение строк бюджета</h6><div class='table-responsive'>`;
  html += `<table class='table table-sm align-middle'><thead><tr><th>Категория</th><th>Статья</th><th>${d.version_a_name}</th><th>${d.version_b_name}</th></tr></thead><tbody>`;

  d.comparison_rows.forEach(row => {
    let classA = '';
    let classB = '';

    if (row.status === 'same') {
      classA = 'cmp-same';
      classB = 'cmp-same';
    } else if (row.status === 'diff') {
      classA = 'cmp-diff';
      classB = 'cmp-diff';
    } else {
      classA = row.a_line_total === null ? 'cmp-missing' : '';
      classB = row.b_line_total === null ? 'cmp-missing' : '';
    }

    const aValue = row.a_line_total === null ? '' : fmt(row.a_line_total);
    const bValue = row.b_line_total === null ? '' : fmt(row.b_line_total);
    html += `<tr><td>${row.category}</td><td>${row.item_name}</td><td class='${classA}'>${aValue}</td><td class='${classB}'>${bValue}</td></tr>`;
  });

  if (!d.comparison_rows.length){
    html += `<tr><td colspan='4' class='text-muted'>Нет данных для сравнения.</td></tr>`;
  }

  html += `</tbody></table></div></div>`;
  document.getElementById('result').innerHTML = html;
}
</script>
</body>
</html>
