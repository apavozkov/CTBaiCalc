services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ctb
      POSTGRES_USER: ctb
      POSTGRES_PASSWORD: ctb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctb -d ctb"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./categories.json:/app/categories.json:ro
    environment:
      DATABASE_URL: postgresql+psycopg2://ctb:ctb@db:5432/ctb
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
    ports:
      - "8000:8000"
    command: bash -lc "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
